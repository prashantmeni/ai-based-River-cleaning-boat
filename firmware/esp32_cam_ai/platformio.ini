; ========================================================================
; PlatformIO project — ESP32-CAM AI vision unit (Controller A)
; Build with:  pio run
; Upload with: pio run -t upload   (ESP32-CAM: GPIO0 -> GND, press Reset)
; Monitor:     pio device monitor
; ========================================================================

[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; AI-Thinker ESP32-CAM uses the esp32cam board. If upload fails, use
; board = esp32dev and set GPIO0 low during boot.

build_flags =
    -I../../shared/protocol

lib_deps =
    ; esp_camera is provided by the arduino-esp32 framework (no external lib)

src_filter = +<*> -<test*>

; Note: no trained model is committed. Place your INT8 TFLite model in
; assets/model/ and wire it into src/inference.cpp before expecting real
; detections.
