; PlatformIO Project Configuration File — Controller B: standard ESP32
; (main boat controller). Controller A (ESP32-CAM AI vision) lives in
; the parent firmware/ project. Shared UART protocol library:
; shared_protocol/rb_protocol (lib_extra_dirs).

[platformio]
src_dir = src

[env:esp32main]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -O2
lib_extra_dirs =
    ${PROJECT_DIR}/../../shared_protocol
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
	mikalhart/TinyGPSPlus@^1.0.3
