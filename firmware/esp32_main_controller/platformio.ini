; ========================================================================
; PlatformIO project — Standard ESP32 main controller (Controller B)
; Build with:  pio run
; Upload with: pio run -t upload
; Monitor:     pio device monitor
; ========================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I../shared/protocol

lib_deps =
    ; No external dependencies beyond arduino-esp32 framework.

src_filter = +<*> -<test*>

; Verify pin assignments in docs/PIN_MAPPING.md before upload.
; The GPS uses Serial2 (GPIO16 RX, GPIO17 TX) on this build.
