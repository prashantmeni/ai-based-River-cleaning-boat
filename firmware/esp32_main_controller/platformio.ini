; ========================================================================
; PlatformIO project — Standard ESP32 main controller (Controller B)
; Build with:  pio run
; Upload with: pio run -t upload
; Monitor:     pio device monitor
; ========================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.partitions = default.csv

build_flags =
    -I../../shared/protocol

lib_deps =
    links2004/WebSockets@^2.0.0   ; dashboard WebSocket gateway
    knolleary/PubSubClient@^2.8    ; MQTT client for cloud telemetry & commands

src_filter = +<*> -<test*>

; Pin assignments: firmware/esp32_main_controller/include/boat_config.h
; (ESP-NOW channel 1 shared with the dashboard SoftAP on 192.168.4.1:81).
