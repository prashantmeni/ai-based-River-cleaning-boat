; PlatformIO Project Configuration File — Controller A: ESP32-CAM (AI vision)
; Controller B (standard ESP32) lives in firmware/esp32_main/.
; Shared UART protocol library: shared_protocol/rb_protocol (lib_extra_dirs).
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src

[env:esp32cam]
platform = espressif32@6.7.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DF_CPU=240000000L
    -I${PROJECT_DIR}/models
    -O2
    -DTF_LITE_USE_CTIME
build_unflags =
    -Os
    -Og
    -O0
lib_extra_dirs =
    ${PROJECT_DIR}/../shared_protocol
lib_deps =
	esp32-camera
	bblanchon/ArduinoJson@^7.0.0
	eloquentarduino/tflm_esp32@^2.0.0
